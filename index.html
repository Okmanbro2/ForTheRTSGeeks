<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Havatican RTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }

    #nameScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: white;
    }

    #nameScreen h1 { font-size: 2rem; color: #e94560; }
    #nameScreen p  { color: #aaa; }

    #nameInput {
      padding: 10px 20px;
      font-size: 1rem;
      border: 2px solid #e94560;
      border-radius: 8px;
      background: #16213e;
      color: white;
      outline: none;
      text-align: center;
    }

    #joinBtn {
      padding: 10px 30px;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #joinBtn:hover { background: #c73652; }
    #gameContainer { display: none; }
  </style>
</head>
<body>
  <div id="nameScreen">
    <h1>Havatican RTS Game</h1>
    <p>Type a name to join the game or start a game if no one is in.</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Chud Ahh Name" />
    <button id="joinBtn">Join Game</button>
  </div>

  <div id="gameContainer"></div>

  <div id="debugLog" style="
    position: fixed; top: 0; left: 0;
    background: rgba(0,0,0,0.8);
    color: #00ff00;
    font-size: 12px;
    font-family: monospace;
    padding: 8px;
    z-index: 9999;
    max-width: 400px;
    pointer-events: none;
  "></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
