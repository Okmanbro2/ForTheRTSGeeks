<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Havatican RTS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; }

    #nameScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: white;
    }

    #nameScreen h1 { font-size: 2rem; color: #e94560; }
    #nameScreen p  { color: #aaa; }

    #nameInput {
      padding: 10px 20px;
      font-size: 1rem;
      border: 2px solid #e94560;
      border-radius: 8px;
      background: #16213e;
      color: white;
      outline: none;
      text-align: center;
    }

    /* teams */
    #teamPicker {
      display: flex;
      gap: 14px;
      margin-top: 4px;
    }

    .teamBtn {
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      border: 3px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }

    .teamBtn.havatica {
      background: rgba(180, 130, 220, 0.15);
      color: #c9a0f0;
      border-color: rgba(180, 130, 220, 0.3);
    }
    .teamBtn.havatica:hover,
    .teamBtn.havatica.selected {
      background: rgba(180, 130, 220, 0.3);
      border-color: #c9a0f0;
      box-shadow: 0 0 12px rgba(180, 130, 220, 0.4);
    }

    .teamBtn.worstendom {
      background: rgba(80, 80, 80, 0.2);
      color: #888;
      border-color: rgba(100, 100, 100, 0.3);
    }
    .teamBtn.worstendom:hover,
    .teamBtn.worstendom.selected {
      background: rgba(80, 80, 80, 0.45);
      border-color: #888;
      box-shadow: 0 0 12px rgba(100, 100, 100, 0.4);
    }

    #teamLabel {
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #joinBtn {
      padding: 10px 30px;
      font-size: 1rem;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.2s, background 0.2s;
    }

    #joinBtn.ready {
      opacity: 1;
      pointer-events: all;
    }

    #joinBtn:hover { background: #c73652; }
    #gameContainer { display: none; }
  </style>
</head>
<body>
  <div id="nameScreen">
    <h1>Havatican RTS Game</h1>
    <p>Type a name and pick a team (temp)</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Chud Ahh Name" />

    <span id="teamLabel">Those Who Are Team Pickers:</span>
    <div id="teamPicker">
      <button class="teamBtn havatica" data-team="havatica">Havatica</button>
      <button class="teamBtn worstendom" data-team="worstendom">Worstendom</button>
    </div>

    <button id="joinBtn">Join Game</button>
  </div>

  <div id="gameContainer"></div>

  <div id="debugLog" style="
    position: fixed; top: 0; left: 0;
    background: rgba(0,0,0,0.8);
    color: #00ff00;
    font-size: 12px;
    font-family: monospace;
    padding: 8px;
    z-index: 9999;
    max-width: 400px;
    pointer-events: none;
  "></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // team selection
    let selectedTeam = null;

    document.querySelectorAll(".teamBtn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".teamBtn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedTeam = btn.dataset.team;
        checkReady();
      });
    });

    const nameInput = document.getElementById("nameInput");
    const joinBtn   = document.getElementById("joinBtn");

    function checkReady() {
      const hasName = nameInput.value.trim().length > 0;
      const hasTeam = selectedTeam !== null;
      joinBtn.classList.toggle("ready", hasName && hasTeam);
    }

    nameInput.addEventListener("input", checkReady);
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinBtn.click(); });

    joinBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name || !selectedTeam) return;
      window.selectedTeam = selectedTeam;
      document.getElementById("nameScreen").style.display = "none";
      document.getElementById("gameContainer").style.display = "block";
      startGame(name, selectedTeam);
    });
  </script>
  <script src="game.js"></script>
</body>
</html>
